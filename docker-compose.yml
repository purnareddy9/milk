version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: milk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: milk_user
      POSTGRES_PASSWORD: milk_secure_password_2026
      POSTGRES_DB: milk_platform_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milk_user -d milk_platform_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: milk_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: milk_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://milk_user:milk_secure_password_2026@postgres:5432/milk_platform_db?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: "amrit_pure_dairy_jwt_super_secret_key_2026"
      JWT_REFRESH_SECRET: "amrit_pure_dairy_refresh_super_secret_key_2026"
      RAZORPAY_KEY_ID: "rzp_test_AmritDairy2026"
      RAZORPAY_KEY_SECRET: "mock_razorpay_secret_key"
      RAZORPAY_WEBHOOK_SECRET: "mock_razorpay_webhook_secret"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: milk_frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
